<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Mono',monospace;background:#07090d;color:#c8d8e8;min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#07090d}
::-webkit-scrollbar-thumb{background:#1a2535;border-radius:3px}

.top-bar{position:sticky;top:0;z-index:100;background:#07090d;border-bottom:1px solid #1a2535;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:11px;letter-spacing:.18em;color:#3a7bd5;font-weight:700;white-space:nowrap;margin-right:4px}
.subtitle{font-size:10px;color:#2a4560;letter-spacing:.1em;white-space:nowrap}
input[type=text]{background:#0d1520;border:1px solid #1a2535;border-radius:4px;padding:7px 12px;color:#c8d8e8;font-family:'Space Mono',monospace;font-size:12px;outline:none;transition:border .15s}
input[type=text]:focus{border-color:#3a7bd5}
input[type=text]::placeholder{color:#2a4560}
.search-theme{width:180px}
.search-ticker{width:110px;text-transform:uppercase}
.sort-group{display:flex;gap:4px;margin-left:auto}
.sort-btn{background:#0d1520;border:1px solid #1a2535;border-radius:3px;color:#2a4560;font-family:'Space Mono',monospace;font-size:10px;padding:6px 10px;cursor:pointer;transition:all .15s;letter-spacing:.05em}
.sort-btn.on,.sort-btn:hover{border-color:#3a7bd5;color:#3a7bd5}

.ticker-banner{display:none;background:#0d1520;border:1px solid #1e3a5f;border-radius:4px;padding:8px 14px;font-size:11px;color:#8ab4d4;margin:8px 20px 0;max-width:1200px}
.ticker-banner.show{display:block}
.ticker-banner a{color:#3a7bd5;cursor:pointer;text-decoration:underline}

.stats-bar{font-size:10px;color:#2a4560;padding:8px 20px;border-bottom:1px solid #1a2535;letter-spacing:.08em}
.stats-bar span{color:#4a7aaa}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:#1a2535}

/* Card */
.card{background:#07090d;padding:14px 16px 0;display:flex;flex-direction:column;gap:0;transition:background .15s}
.card:hover{background:#0b1220}
.card.lit{background:#0c1a2e;outline:2px solid #3a7bd5;outline-offset:-2px}

.card-top{display:flex;align-items:flex-start;gap:8px;padding-bottom:10px}
.card-num{font-size:10px;color:#2a4560;min-width:26px;padding-top:2px;flex-shrink:0}
.card-name{font-size:13px;font-weight:700;color:#ddeeff;flex:1;line-height:1.3}
.change-pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.up{color:#00e676;background:rgba(0,230,118,.1)}
.dn{color:#ff4060;background:rgba(255,64,96,.1)}
.neu{color:#4a7aaa;background:rgba(74,122,170,.1)}

.bar-row{height:2px;background:#0d1520;margin:0 0 10px}
.bar-fill{height:100%;transition:width .5s}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:12px}
.chip{font-size:11px;color:#3a6a9a;background:#0c1520;border:1px solid #162030;border-radius:3px;padding:3px 7px;cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{color:#7ab4e8;border-color:#2a5070;background:#0f2035}
.chip.hot{color:#ff4060;border-color:#7a2030;background:#1a0810}

/* Fetch button */
.fetch-wrap{border-top:1px solid #111c28;padding:8px 0 10px}
.fetch-btn{font-family:'Space Mono',monospace;font-size:10px;color:#3a7bd5;border:1px solid #1e3a5f;border-radius:3px;padding:4px 12px;cursor:pointer;background:transparent;transition:all .15s;letter-spacing:.05em}
.fetch-btn:hover{background:rgba(58,123,213,.1)}

/* Perf section */
.perf-section{display:none;border-top:1px solid #111c28;padding:10px 0 12px}
.perf-section.open{display:block}

.period-row{display:flex;gap:4px;margin-bottom:10px;align-items:center}
.period-lbl{font-size:10px;color:#2a4560;letter-spacing:.08em;margin-right:4px}
.period-tab{font-size:10px;padding:3px 10px;border:1px solid #1a2535;border-radius:3px;cursor:pointer;color:#2a4560;background:#0d1520;transition:all .15s;font-family:'Space Mono',monospace}
.period-tab:hover,.period-tab.active{border-color:#3a7bd5;color:#3a7bd5}

/* All-periods table */
.all-periods-table{width:100%;border-collapse:collapse;font-size:11px}
.all-periods-table th{color:#2a4560;font-weight:400;text-align:right;padding:0 4px 6px;font-size:10px;letter-spacing:.05em}
.all-periods-table th:first-child{text-align:left}
.all-periods-table td{padding:3px 4px;border-top:1px solid #0f1c28;white-space:nowrap}
.all-periods-table td:first-child{color:#8ab4d4;font-weight:700}
.all-periods-table td:not(:first-child){text-align:right}
.pct-up{color:#00e676}
.pct-dn{color:#ff4060}
.pct-na{color:#2a4560;font-size:10px}

.tp-loading{color:#2a4560;font-size:10px;padding:4px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.loading-pulse{animation:pulse 1.2s infinite}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#2a4560;font-size:13px}
</style>
</head>

const API_KEY = '12343bfe66954ec39519d3c3834578d5';

const MAX_SYMBOLS_PER_REQUEST = 8;

}));

let sortMode = 'n', activeTicker = '', filterQ = '';

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function pillClass(c) { return c > 0 ? 'up' : c < 0 ? 'dn' : 'neu'; }
function barColor(c) { return c > 0 ? '#00e676' : c < 0 ? '#ff4060' : '#2a4560'; }
function barW(c) { return Math.min(Math.abs(c) / 9.5 * 100, 100).toFixed(1); }
function fmtPct(v) {
  if (v === null || v === undefined) return '<span class="pct-na">N/A</span>';
  const s = v >= 0 ? '+' : '';
  return `<span class="${v >= 0 ? 'pct-up' : 'pct-dn'}">${s}${v.toFixed(2)}%</span>`;
}

function buildCard(d) {
  const sign = d.change > 0 ? '+' : '';
  const c5 = d.change5 !== undefined ? d.change5 : null;
  const c10 = d.change10 !== undefined ? d.change10 : null;
  const perfPills = d.fetched
    ? `<div style="display:flex;gap:4px;flex-shrink:0;flex-direction:column;align-items:flex-end">
        <span class="change-pill ${pillClass(d.change)}" style="font-size:10px">${sign}${d.change.toFixed(1)}% <span style="color:#2a4560;font-weight:400">1D</span></span>
        <span class="change-pill ${pillClass(c5 ?? 0)}" style="font-size:10px">${c5 !== null ? (c5>=0?'+':'')+c5.toFixed(1)+'%' : 'N/A'} <span style="color:#2a4560;font-weight:400">5D</span></span>
        <span class="change-pill ${pillClass(c10 ?? 0)}" style="font-size:10px">${c10 !== null ? (c10>=0?'+':'')+c10.toFixed(1)+'%' : 'N/A'} <span style="color:#2a4560;font-weight:400">10D</span></span>
      </div>`
    : `<span class="change-pill neu" style="font-size:10px">-- 未取得</span>`;
  const chips = d.tickers.map(t => {
    const hot = t === activeTicker;
    return `<span class="chip${hot ? ' hot' : ''}" data-ticker="${t}" onclick="clickChip('${t}')">${t}</span>`;
  }).join('');

  return `<div class="card${activeTicker && d.tickers.includes(activeTicker) ? ' lit' : ''}" id="card-${d.n}">
    <div class="card-top">
      <span class="card-num">#${d.n}</span>
      <span class="card-name">${d.name}</span>
      ${perfPills}
    </div>
    <div class="bar-row"><div class="bar-fill" style="width:${barW(d.change)}%;background:${barColor(d.change)}"></div></div>
    <div class="chips">${chips}</div>
    <div class="fetch-wrap">
      <button class="fetch-btn" id="fbtn-${d.n}" onclick="togglePerf(${d.n}, this)">▶ 騰落率を取得</button>
    </div>
    <div class="perf-section" id="perf-${d.n}">
      <div id="perf-body-${d.n}"></div>
    </div>
  </div>`;
}

function render() {
  let data = [...RAW_DATA];
  const q = filterQ.toLowerCase();
  if (q) data = data.filter(d => d.name.toLowerCase().includes(q) || d.tickers.some(t => t.toLowerCase().includes(q)));
  if (sortMode === 'up') data.sort((a, b) => b.change - a.change);
  else if (sortMode === 'dn') data.sort((a, b) => a.change - b.change);
  else if (sortMode === 'fetched') data.sort((a, b) => (b.fetched ? 1 : 0) - (a.fetched ? 1 : 0) || b.change - a.change);

  document.getElementById('sn').textContent = data.length;
  document.getElementById('grid').innerHTML = data.length
    ? data.map(d => buildCard(d)).join('')
    : '<div class="empty">該当テーマなし</div>';

  // restore open perf sections
  Object.keys(fetchedThemes).forEach(n => {
    const sec = document.getElementById(`perf-${n}`);
    const btn = document.getElementById(`fbtn-${n}`);
    if (sec) {
      sec.classList.add('open');
      if (btn) btn.textContent = '▼ 閉じる';
      renderAllPeriods(parseInt(n));
    }
  });
}

function setSort(m, btn) {
  sortMode = m;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// ---- ticker search / highlight ----
function clickChip(t) {
  activeTicker = activeTicker === t ? '' : t;
  document.getElementById('tq').value = activeTicker;
  showBanner(activeTicker);
  render();
  if (activeTicker) scrollToFirst(activeTicker);
}

function showBanner(t) {
  const b = document.getElementById('tbanner');
  if (!t) { b.className = 'ticker-banner'; return; }
  const themes = tickerMap[t] || [];
  if (!themes.length) {
    b.className = 'ticker-banner show';
    b.innerHTML = `<b>${t}</b> はどのテーマにも含まれていません`;
    return;
  }
  b.className = 'ticker-banner show';
  b.innerHTML = `<b style="color:#7ab4e8">${t}</b> 含まれるテーマ: `
    + themes.map(d => `<a onclick="scrollToCard(${d.n})">#${d.n} ${d.name}</a>`).join(' &nbsp;|&nbsp; ');
}

function scrollToFirst(t) {
  const themes = tickerMap[t] || [];
  if (themes.length) {
    setTimeout(() => {
      const el = document.getElementById(`card-${themes[0].n}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 50);
  }
}

function scrollToCard(n) {
  const el = document.getElementById(`card-${n}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

  activeTicker = e.target.value.trim().toUpperCase();

  render();

    showBanner(activeTicker);
    render();
    if (activeTicker) scrollToFirst(activeTicker);

// ---- Performance fetch ----
async function fetchPerf(n, tickers, period, onProgress) {
  const key = `${n}-${period}`;
  if (perfCache[key]) return perfCache[key];

  const results = {};

  if (period === '1day') {
    const batches = [];
    for (let i = 0; i < tickers.length; i += MAX_SYMBOLS_PER_REQUEST)
      batches.push(tickers.slice(i, i + MAX_SYMBOLS_PER_REQUEST));

    for (let bi = 0; bi < batches.length; bi++) {
      if (bi > 0) {
        for (let t = RATE_LIMIT_DELAY / 1000; t > 0; t--) {
          onProgress && onProgress(`待機中... ${t}秒`);
          await sleep(1000);
        }
      }
      const batch = batches[bi];
      onProgress && onProgress(`1D 取得中 ${bi * MAX_SYMBOLS_PER_REQUEST + 1}〜${Math.min((bi+1)*MAX_SYMBOLS_PER_REQUEST, tickers.length)} / ${tickers.length}`);
      try {
        const resp = await fetch(`https://api.twelvedata.com/quote?symbol=${batch.join(',')}&apikey=${API_KEY}`);
        const data = await resp.json();
        for (const sym of batch) {
          const q = batch.length === 1 ? data : data[sym];
          results[sym] = (!q || q.status === 'error' || q.percent_change == null) ? null : parseFloat(q.percent_change);
        }
      } catch { batch.forEach(s => { results[s] = null; }); }
    }

  } else {
    const outputSize = period === '5day' ? 6 : 11;
    for (let i = 0; i < tickers.length; i++) {
      const sym = tickers[i];
      if (i > 0) {
        for (let t = RATE_LIMIT_DELAY / 1000; t > 0; t--) {
          onProgress && onProgress(`待機中... ${t}秒 (${i}/${tickers.length})`);
          await sleep(1000);
        }
      }
      onProgress && onProgress(`${period === '5day' ? '5D' : '10D'} 取得中 ${sym} (${i+1}/${tickers.length})`);
      try {
        const resp = await fetch(`https://api.twelvedata.com/time_series?symbol=${sym}&interval=1day&outputsize=${outputSize}&apikey=${API_KEY}`);
        const data = await resp.json();
        if (!data || data.status === 'error' || !data.values || data.values.length < 2) {
          results[sym] = null;
        } else {
          const vals = data.values;
          const newest = parseFloat(vals[0].close);
          const oldest = parseFloat(vals[vals.length - 1].open || vals[vals.length - 1].close);
          results[sym] = ((newest - oldest) / oldest) * 100;
        }
      } catch { results[sym] = null; }
    }
  }

  perfCache[key] = results;
  return results;
}

async function togglePerf(n, btn) {
  const sec = document.getElementById(`perf-${n}`);
  if (sec.classList.contains('open')) {
    sec.classList.remove('open');
    btn.textContent = '▶ 騰落率を取得';
    return;
  }
  sec.classList.add('open');
  btn.textContent = '▼ 閉じる';

  const themeData = RAW_DATA.find(d => d.n === n);
  const body = document.getElementById(`perf-body-${n}`);
  body.innerHTML = `<div class="tp-loading loading-pulse" id="prog-${n}">1D / 5D / 10D 一括取得中...</div>`;

  // fetch all 3 periods in parallel
  await Promise.all([
    fetchPerf(n, themeData.tickers, '1day',  msg => { const e = document.getElementById(`prog-${n}`); if (e) e.textContent = '[1D] ' + msg; }),
    fetchPerf(n, themeData.tickers, '5day',  () => {}),
    fetchPerf(n, themeData.tickers, '10day', () => {}),
  ]);

  renderAllPeriods(n);

 if (!fetchedThemes[n]) {
    fetchedThemes[n] = true;
    document.getElementById('sf').textContent = Object.keys(fetchedThemes).length;
  }

  // 更新済みテーマが1件以上あれば自動で「更新済み」ソートに切替
  const fetchedBtn = document.getElementById('sort-fetched-btn');
  if (fetchedBtn && sortMode !== 'fetched') {
    setSort('fetched', fetchedBtn);
  } else {
    render();
  }
}

function renderAllPeriods(n) {
  const themeData = RAW_DATA.find(d => d.n === n);
  if (!themeData) return;
  const body = document.getElementById(`perf-body-${n}`);
  if (!body) return;

  const r1  = perfCache[`${n}-1day`]  || {};
  const r5  = perfCache[`${n}-5day`]  || {};
  const r10 = perfCache[`${n}-10day`] || {};

  const avg = (cache) => {
    const vals = themeData.tickers.map(t => cache[t]).filter(v => v !== null && v !== undefined);
    return vals.length > 0 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const a1 = avg(r1), a5 = avg(r5), a10 = avg(r10);
  if (a1 !== null) { themeData.change = a1; themeData.fetched = true; }
  if (a5 !== null)  themeData.change5  = a5;
  if (a10 !== null) themeData.change10 = a10;

  // sort by 1D desc
  const syms = themeData.tickers.slice().sort((a, b) => {
    const va = r1[a] ?? -Infinity;
    const vb = r1[b] ?? -Infinity;
    return vb - va;
  });

  const rows = syms.map(sym => `
    <tr>
      <td>${sym}</td>
      <td>${fmtPct(r1[sym] ?? null)}</td>
      <td>${fmtPct(r5[sym] ?? null)}</td>
      <td>${fmtPct(r10[sym] ?? null)}</td>
    </tr>`).join('');

  body.innerHTML = `
    <table class="all-periods-table">
      <thead>
        <tr>
          <th>銘柄</th>
          <th>1D</th>
          <th>5D</th>
          <th>10D</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}
